<title>Wirdö OS · Acceso del equipo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--navy:#2A4873;--blue:#0F6DF3;--teal:#469083;--ink:#14223A;--muted:#6A7890;--bg:#F7F9FC}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:Ubuntu,"Helvetica Neue",Arial,sans-serif;display:grid;place-items:center;padding:24px}
  main{max-width:420px;width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px}
  .ring{width:72px;height:72px;border-radius:50%;border:2px solid #D9E3F2;border-top-color:var(--blue);animation:spin 1.1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.ring{animation:none}}
  .mark{font-weight:700;font-size:30px;letter-spacing:-.02em;color:var(--navy)}
  .mark span{color:var(--blue)}
  p{margin:0;color:var(--muted);line-height:1.55}
  a.btn{display:inline-block;background:var(--navy);color:#fff;text-decoration:none;font-weight:500;padding:13px 26px;border-radius:999px}
  a.btn:hover{background:var(--blue)}
  small{color:var(--muted);font-size:12.5px}
</style>
</head>
<body>
<main>
  <div class="ring" aria-hidden="true"></div>
  <div class="mark">wirdö <span>OS</span></div>
  <p>Acceso exclusivo para el equipo de Wirdö. Te estamos llevando a la plataforma.</p>
  <a class="btn" href="https://claude.ai/artifact/7dcW9db7xX4kTsumj644sr">Entrar a Wirdö OS</a>
  <small>Inicia sesión con la cuenta con la que te invitaron. Si no tienes acceso, pídelo a Fernando.</small>
</main>
<script>setTimeout(function(){location.replace("https://claude.ai/artifact/7dcW9db7xX4kTsumj644sr")},1200);</script>
</body>
</html>
